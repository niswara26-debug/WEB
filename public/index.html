<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noise Guard System</title>
    <style>
        /* =====================================================
           RESET & BASE
        ===================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #090b10;
            color: #f8fafc;
            transition: background 0.6s ease, color 0.5s ease;
        }

        /* =====================================================
           MODE MENUNGGU & AMAN (LATAR BELAKANG GELAP BERSIH)
        ===================================================== */
        body.menunggu-mode {
            background: radial-gradient(circle at 50% 0%, #131824 0%, #090b10 65%);
            color: #dce5f2;
        }

        body.aman-mode {
            background: radial-gradient(circle at 50% 0%, #0f1d2e 0%, #090b10 65%);
            color: #e8f3ff;
        }

        /* =====================================================
           MODE BAHAYA - MERAH
        ===================================================== */
        body.berisik-mode {
            background: #970f08;
            color: #ffffff;
        }

        /* =====================================================
           WRAPPER
        ===================================================== */
        .dashboard-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* =====================================================
           CARD
        ===================================================== */
        .card {
            width: min(1450px, 100%);
            min-height: 700px;
            border-radius: 28px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, border 0.5s ease, box-shadow 0.5s ease;
        }

        /* CARD MENUNGGU */
        .menunggu-theme {
            background: linear-gradient(160deg, #0f131d 0%, #090b10 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
        }

        /* CARD AMAN */
        .aman-theme {
            background: linear-gradient(160deg, #0d1926 0%, #090b10 100%);
            border: 1px solid rgba(56, 189, 248, 0.18);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
        }

        /* CARD BAHAYA */
        .berisik-theme {
            background: #aa130a;
            border: 2px solid rgba(255,255,255,0.15);
            box-shadow: 0 0 70px rgba(255, 30, 20, 0.30);
        }

        /* =====================================================
           ORNAMEN BENDA LANGIT (SETENGAH LINGKARAN ATAS TENGAH)
        ===================================================== */
        .sky-dome {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 340px;
            height: 170px;
            border-bottom-left-radius: 340px;
            border-bottom-right-radius: 340px;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.09);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
            transition: background 1.2s ease, box-shadow 1.2s ease, opacity 0.4s ease;
        }

        body.berisik-mode .sky-dome {
            opacity: 0;
        }

        .sky-scene {
            position: absolute;
            inset: 0;
            opacity: 0;
            transform: translateY(-10px) scale(0.96);
            transition: opacity 1s ease, transform 1s ease;
        }

        body.time-pagi .sky-dome {
            background: radial-gradient(circle at 50% 15%, rgba(251, 191, 36, 0.22), rgba(245, 158, 11, 0.06) 65%, rgba(9, 11, 16, 0.4) 100%);
            box-shadow: 0 12px 45px rgba(251, 191, 36, 0.14);
        }
        body.time-pagi .scene-pagi { opacity: 1; transform: translateY(0) scale(1); }

        body.time-siang .sky-dome {
            background: radial-gradient(circle at 50% 10%, rgba(56, 189, 248, 0.24), rgba(14, 165, 233, 0.07) 65%, rgba(9, 11, 16, 0.4) 100%);
            box-shadow: 0 12px 45px rgba(56, 189, 248, 0.16);
        }
        body.time-siang .scene-siang { opacity: 1; transform: translateY(0) scale(1); }

        body.time-sore .sky-dome {
            background: radial-gradient(circle at 50% 85%, rgba(249, 115, 22, 0.28), rgba(168, 85, 247, 0.12) 60%, rgba(9, 11, 16, 0.5) 100%);
            box-shadow: 0 12px 45px rgba(249, 115, 22, 0.16);
        }
        body.time-sore .scene-sore { opacity: 1; transform: translateY(0) scale(1); }

        body.time-malam .sky-dome {
            background: radial-gradient(circle at 50% 25%, rgba(129, 140, 248, 0.20), rgba(30, 27, 75, 0.15) 65%, rgba(9, 11, 16, 0.55) 100%);
            box-shadow: 0 12px 45px rgba(129, 140, 248, 0.14);
        }
        body.time-malam .scene-malam { opacity: 1; transform: translateY(0) scale(1); }

            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: radial-gradient(circle, #fef08a 0%, #f59e0b 85%);
            box-shadow: 0 0 28px rgba(251, 191, 36, 0.75), 0 0 55px rgba(245, 158, 11, 0.35);
            animation: floatSlow 6s ease-in-out infinite;
        }
        .halo-pagi {

            animation: spinSlow 28s linear infinite;
        }
        .cloud-mini {
            position: absolute;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            backdrop-filter: blur(2px);
        }
        .cloud-pagi-1 { width: 64px; height: 16px; top: 88px; left: 58px; animation: driftRight 9s ease-in-out infinite alternate; }
        .cloud-pagi-2 { width: 52px; height: 14px; top: 74px; right: 62px; animation: driftLeft 8s ease-in-out infinite alternate; }

        /* --- Detail Ornamen Siang --- */

            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #fde047 65%, #38bdf8 100%);
            box-shadow: 0 0 34px rgba(253, 224, 71, 0.8), 0 0 65px rgba(56, 189, 248, 0.45);
        }
        .rays-siang {
            position: absolute;
            top: 7px;
            left: 50%;
            transform: translateX(-50%);
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 1.5px dotted rgba(186, 230, 253, 0.55);
            animation: spinSlow 20s linear infinite;
        }
        .cloud-siang-1 { width: 74px; height: 18px; top: 96px; left: 68px; background: rgba(224, 242, 254, 0.18); animation: driftRight 7s ease-in-out infinite alternate; }
        .cloud-siang-2 { width: 60px; height: 15px; top: 82px; right: 66px; background: rgba(224, 242, 254, 0.15); animation: driftLeft 7.5s ease-in-out infinite alternate; }

        /* --- Detail Ornamen Sore --- */
