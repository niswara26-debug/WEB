<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noise Guard System</title>
    <style>
        /* =====================================================
           RESET & BASE
        ===================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* =====================================================
           MODE MENUNGGU
        ===================================================== */
        body.menunggu-mode {
            background: radial-gradient(circle at center, #1b2639 0%, #0d1523 55%, #070c14 100%);
            color: #dce5f2;
        }

        /* =====================================================
           MODE AMAN - BIRU
        ===================================================== */
        body.aman-mode {
            background: radial-gradient(circle at center, #142b49 0%, #0a1a31 55%, #050d18 100%);
            color: #e8f3ff;
        }

        /* =====================================================
           MODE BAHAYA - MERAH
        ===================================================== */
        body.berisik-mode {
            background: #970f08;
            color: #ffffff;
        }

        /* =====================================================
           WRAPPER
        ===================================================== */
        .dashboard-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* =====================================================
           CARD
        ===================================================== */
        .card {
            width: min(1450px, 100%);
            min-height: 700px;
            border-radius: 28px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, border 0.5s ease, box-shadow 0.5s ease;
        }

        /* =====================================================
           CARD MENUNGGU
        ===================================================== */
        .menunggu-theme {
            background: linear-gradient(145deg, #111a2a, #080f1a);
            border: 1px solid #29364b;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        /* =====================================================
           CARD AMAN
        ===================================================== */
        .aman-theme {
            background: linear-gradient(145deg, #132b4a, #08172b);
            border: 1px solid #264b73;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        /* =====================================================
           CARD BAHAYA
        ===================================================== */
        .berisik-theme {
            background: #aa130a;
            border: 2px solid rgba(255,255,255,0.15);
            box-shadow: 0 0 70px rgba(255, 30, 20, 0.30);
        }

        /* =====================================================
           HEADER
        ===================================================== */
        .card-header {
            width: 100%;
            padding: 28px 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 20;
        }

        /* =====================================================
           KELOMPOK LOGO
        ===================================================== */
        .logo-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            height: 60px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            border-radius: 999px;
            background: rgba(0,0,0,0.28);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #8190a6;
        }

        /* =====================================================
           STATUS AREA
        ===================================================== */
        .status-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 35px;
            position: relative;
        }

        /* =====================================================
           JAM DIGITAL
        ===================================================== */
        .digital-clock {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            opacity: 0.9;
            margin-bottom: 25px;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            z-index: 2;
        }

        .berisik-mode .digital-clock {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        /* =====================================================
           ICON
        ===================================================== */
        .icon-wrapper {
            width: 155px;
            height: 155px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 75px;
            margin-bottom: 35px;
            border: 2px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
        }

        /* =====================================================
           TITLE
        ===================================================== */
        .status-title {
            font-size: clamp(4rem, 8vw, 8rem);
            line-height: 0.95;
            font-weight: 900;
            letter-spacing: 5px;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .status-subtitle {
            font-size: clamp(1.1rem, 2vw, 1.6rem);
            font-weight: 600;
            opacity: 0.82;
            max-width: 1050px;
            line-height: 1.45;
        }

        /* =====================================================
           PANEL DATA
        ===================================================== */
        .bottom-panel {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            padding: 30px 38px 38px;
            border-top: 1px solid rgba(255,255,255,0.10);
        }

        .info-box {
            min-height: 130px;
            padding: 25px 35px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.10);
        }

        .db-info-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .box-label {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .db-subtext {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.60);
        }

        .db-value-container {
            display: flex;
